<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>信用卡費 確認繳費</title>
<style>
  :root{
    --bg:#eef2f7;
    --card:#ffffff;
    --line:#e5e7eb;
    --text:#1f2937;
    --muted:#6b7280;
    --blue:#2563eb;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    padding:28px 16px 90px;
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1040px;margin:0 auto}
  h1{font-size:26px;margin:0 0 6px;text-align:center;letter-spacing:1px}
  .subtitle{text-align:center;color:var(--muted);font-size:13px;margin:0 0 22px}

  .card{background:var(--card);border-radius:16px;box-shadow:0 10px 30px rgba(15,23,42,.08);overflow:hidden}

  /* ---------- 工具列 ---------- */
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 18px;
           border-bottom:1px solid var(--line);background:#fbfcfe}
  .toolbar .spacer{flex:1}
  .btn{font-family:inherit;font-size:14px;font-weight:700;border-radius:10px;padding:10px 18px;
       cursor:pointer;border:1px solid transparent;transition:all .15s}
  .btn-primary{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.3)}
  .btn-primary:hover{background:#1d4ed8}
  .btn-ghost{background:#fff;color:var(--blue);border-color:#c7dbfd}
  .btn-ghost:hover{background:#eff6ff}

  /* ---------- 表格 ---------- */
  .grid-head,.row{display:grid;grid-template-columns:1.2fr 1.5fr 1.5fr 1.1fr;gap:12px;
                  align-items:center;padding:12px 18px}
  .grid-head{background:#f8fafc;border-bottom:1px solid var(--line);
             font-size:13px;font-weight:700;color:#475569}
  .row{border-bottom:1px solid #f1f4f8}
  .row:last-child{border-bottom:none}
  .row:hover{background:#fafcff}
  .cell{min-width:0}

  /* 銀行 */
  .bank-cell{display:flex;align-items:center;gap:8px}
  .bank-name{font-weight:700;font-size:15px}
  .bank-input{flex:1;min-width:0;padding:8px 10px;border:1px solid #d1d5db;border-radius:8px;
              font-family:inherit;font-size:14px;color:#111827}
  .bank-input:focus{outline:2px solid #bfdbfe;border-color:#93c5fd}
  .del-btn{flex:0 0 auto;border:1px solid #fecaca;background:#fff5f5;color:#dc2626;
           border-radius:8px;padding:7px 9px;font-size:12px;font-weight:700;cursor:pointer;
           font-family:inherit;line-height:1}
  .del-btn:hover{background:#fee2e2}

  /* 日期 */
  .date-wrap{display:flex;gap:6px;align-items:center}
  input[type="date"]{
    flex:1;min-width:0;width:100%;
    padding:7px 8px;border:1px solid #d1d5db;border-radius:8px;
    font-size:14px;color:#111827;background:#fff;font-family:inherit;
  }
  input[type="date"]:focus{outline:2px solid #bfdbfe;border-color:#93c5fd}
  .clear-btn{flex:0 0 auto;border:1px solid #d1d5db;background:#f3f4f6;color:#4b5563;
             padding:7px 10px;border-radius:8px;font-size:13px;font-weight:700;
             cursor:pointer;font-family:inherit;white-space:nowrap}
  .clear-btn:hover{background:#e5e7eb}

  /* 狀態 */
  .status-label{
    display:inline-flex;align-items:center;gap:8px;
    padding:7px 14px 7px 11px;border-radius:999px;
    font-size:14px;font-weight:700;cursor:pointer;user-select:none;
    background:#fee2e2;color:#b91c1c;border:1px solid #fecaca;
    transition:background .18s,color .18s,border-color .18s;
  }
  .status-label.paid{background:#dcfce7;color:#15803d;border-color:#bbf7d0}
  .status-label input[type="checkbox"]{width:16px;height:16px;cursor:pointer;accent-color:#111827}

  /* ---------- 提醒視窗 ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:100;
    display:flex;align-items:center;justify-content:center;padding:20px;
    backdrop-filter:blur(2px);
  }
  .modal-overlay[hidden]{display:none}
  .modal{
    background:#fff;border-radius:16px;width:min(480px,100%);max-height:80vh;
    display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);
    animation:pop .18s ease-out;
  }
  @keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
  .modal-head{padding:18px 20px;border-bottom:1px solid var(--line);
              display:flex;align-items:center;gap:10px}
  .modal-head h2{margin:0;font-size:18px}
  .modal-body{padding:8px 20px;overflow:auto}
  .modal-body ul{list-style:none;margin:0;padding:0}
  .modal-body li{display:flex;justify-content:space-between;gap:12px;align-items:center;
                 padding:13px 0;border-bottom:1px dashed #e8edf3}
  .modal-body li:last-child{border-bottom:none}
  .rem-info{display:flex;flex-direction:column;gap:3px;min-width:0}
  .rem-info strong{font-size:15px}
  .rem-info span{font-size:12.5px;color:var(--muted)}
  .tag{font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap}
  .tag.overdue{background:#fee2e2;color:#b91c1c}
  .tag.urgent{background:#ffedd5;color:#c2410c}
  .tag.soon{background:#fef3c7;color:#a16207}
  .modal-foot{padding:14px 20px;border-top:1px solid var(--line);
              display:flex;justify-content:flex-end}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:32px;transform:translate(-50%,20px);
    background:#111827;color:#fff;padding:11px 24px;border-radius:999px;
    font-size:14px;font-weight:700;opacity:0;pointer-events:none;
    transition:all .25s;z-index:200;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---------- 手機版 ---------- */
  @media (max-width:760px){
    .grid-head{display:none}
    .row{grid-template-columns:1fr;gap:10px;padding:16px 18px}
    .cell::before{content:attr(data-label);display:block;width:100%;
                  font-size:12px;font-weight:700;color:#94a3b8;margin-bottom:5px}
    .bank-cell{flex-wrap:wrap}
    .bank-cell::before{flex-basis:100%}
    body{padding:18px 10px 80px}
  }
</style>
</head>
<body>

<div class="wrap">
  <h1>信用卡費 確認繳費</h1>
  <p class="subtitle">勾選即代表已繳費，資料會自動儲存在此瀏覽器</p>

  <div class="card">
    <div class="toolbar">
      <button id="saveBtn" class="btn btn-primary">儲存</button>
      <button id="addBtn" class="btn btn-ghost">＋ 新增銀行</button>
      <span class="spacer"></span>
    </div>

    <div class="grid-head">
      <div>銀行</div>
      <div>結帳日</div>
      <div>繳費截止日</div>
      <div>繳費狀態</div>
    </div>

    <div id="list"></div>
  </div>
</div>

<!-- 提醒視窗 -->
<div class="modal-overlay" id="reminderModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="remTitle">
    <div class="modal-head">
      <span style="font-size:20px">⚠️</span>
      <h2 id="remTitle">繳費提醒</h2>
    </div>
    <div class="modal-body" id="reminderList"></div>
    <div class="modal-foot">
      <button class="btn btn-primary" id="closeReminder">關閉</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  /* ============ 設定 ============ */
  const STORAGE_KEY = 'ccFeeApp.v1';
  const REMIND_DAYS = 5;   // 截止日前幾天開始提醒
  const FIXED_BANKS = [
    '中國信託', '國泰世華', '台北富邦', '新光銀行',
    '台新銀行', '台灣樂天信用卡', '永豐銀行', '凱基銀行'
  ];

  /* ============ DOM ============ */
  const listEl   = document.getElementById('list');
  const addBtn   = document.getElementById('addBtn');
  const saveBtn  = document.getElementById('saveBtn');
  const modal    = document.getElementById('reminderModal');
  const modalList= document.getElementById('reminderList');
  const closeBtn = document.getElementById('closeReminder');
  const toastEl  = document.getElementById('toast');

  let rows = [];

  /* ============ 小工具 ============ */
  function uid() {
    return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
  function daysUntil(dateStr) {
    if (!dateStr) return null;
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const d = new Date(dateStr + 'T00:00:00');
    if (isNaN(d.getTime())) return null;
    return Math.round((d - today) / 86400000);
  }
  function fmtDate(dateStr) {
    if (!dateStr) return '';
    const p = dateStr.split('-');
    return p.length === 3 ? p[0] + '/' + p[1] + '/' + p[2] : dateStr;
  }
  function blankRow(name, fixed) {
    return { id: uid(), name: name, fixed: !!fixed, statement: '', due: '', paid: false };
  }

  /* ============ 資料存取 ============ */
  function load() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch (e) { saved = null; }

    if (Array.isArray(saved) && saved.length) {
      rows = saved.map(function (r) {
        return {
          id: r.id || uid(),
          name: r.name || '',
          fixed: !!r.fixed,
          statement: r.statement || '',
          due: r.due || '',
          paid: !!r.paid
        };
      });

      // 確保 8 家固定銀行一定存在，且排在最前面
      const byName = new Map();
      rows.forEach(function (r) { if (!byName.has(r.name)) byName.set(r.name, r); });

      const fixedRows = FIXED_BANKS.map(function (name) {
        const exist = byName.get(name);
        if (exist) { exist.fixed = true; byName.delete(name); return exist; }
        return blankRow(name, true);
      });
      rows = fixedRows.concat(Array.from(byName.values()));
    } else {
      rows = FIXED_BANKS.map(function (n) { return blankRow(n, true); });
    }
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(rows)); }
    catch (e) { console.warn('儲存失敗', e); }
  }

  /* ============ 畫面渲染 ============ */
  function rowHTML(r) {
    const paidClass = r.paid ? 'paid' : '';
    const statusTxt = r.paid ? '已繳費' : '未繳費';

    const bankPart = r.fixed
      ? '<span class="bank-name">' + esc(r.name) + '</span>'
      : '<input class="bank-input" type="text" value="' + esc(r.name) + '" placeholder="輸入銀行名稱">'
        + '<button type="button" class="del-btn" title="刪除這家銀行">刪除</button>';

    return ''
      + '<div class="row" data-id="' + r.id + '">'
      +   '<div class="cell bank-cell" data-label="銀行">' + bankPart + '</div>'

      +   '<div class="cell" data-label="結帳日">'
      +     '<div class="date-wrap">'
      +       '<input type="date" class="date-input" data-field="statement" value="' + (r.statement || '') + '">'
      +       '<button type="button" class="clear-btn" data-field="statement">清除</button>'
      +     '</div>'
      +   '</div>'

      +   '<div class="cell" data-label="繳費截止日">'
      +     '<div class="date-wrap">'
      +       '<input type="date" class="date-input" data-field="due" value="' + (r.due || '') + '">'
      +       '<button type="button" class="clear-btn" data-field="due">清除</button>'
      +     '</div>'
      +   '</div>'

      +   '<div class="cell" data-label="繳費狀態">'
      +     '<label class="status-label ' + paidClass + '">'
      +       '<input type="checkbox" class="paid-check" ' + (r.paid ? 'checked' : '') + '>'
      +       '<span class="status-text">' + statusTxt + '</span>'
      +     '</label>'
      +   '</div>'
      + '</div>';
  }

  function render() {
    listEl.innerHTML = rows.map(rowHTML).join('');
  }

  function findRow(el) {
    const rowEl = el.closest('.row');
    if (!rowEl) return null;
    const data = rows.find(function (r) { return r.id === rowEl.dataset.id; });
    return data ? { rowEl: rowEl, data: data } : null;
  }

  /* ============ 事件：輸入日期 / 銀行名稱 ============ */
  listEl.addEventListener('input', function (e) {
    const found = findRow(e.target);
    if (!found) return;
    const data = found.data;

    if (e.target.classList.contains('date-input')) {
      data[e.target.dataset.field] = e.target.value;
    } else if (e.target.classList.contains('bank-input')) {
      data.name = e.target.value;
    }
  });

  /* ============ 事件：勾選已繳費 ============ */
  listEl.addEventListener('change', function (e) {
    if (!e.target.classList.contains('paid-check')) return;
    const found = findRow(e.target);
    if (!found) return;

    found.data.paid = e.target.checked;

    const label = e.target.closest('.status-label');
    const txt   = label.querySelector('.status-text');
    label.classList.toggle('paid', found.data.paid);
    txt.textContent = found.data.paid ? '已繳費' : '未繳費';
  });

  /* ============ 事件：清除 / 刪除 ============ */
  listEl.addEventListener('click', function (e) {
    // 清除日期
    const clearBtn = e.target.closest('.clear-btn');
    if (clearBtn) {
      const found = findRow(clearBtn);
      if (!found) return;
      const field = clearBtn.dataset.field;
      found.data[field] = '';
      const input = found.rowEl.querySelector('.date-input[data-field="' + field + '"]');
      if (input) input.value = '';
      return;
    }

    // 刪除自訂銀行
    const delBtn = e.target.closest('.del-btn');
    if (delBtn) {
      const found = findRow(delBtn);
      if (!found) return;
      const name = found.data.name || '（未命名銀行）';
      if (!confirm('確定要刪除「' + name + '」嗎？')) return;
      rows = rows.filter(function (r) { return r.id !== found.data.id; });
      save();
      render();
    }
  });

  /* ============ 新增銀行 ============ */
  addBtn.addEventListener('click', function () {
    const r = blankRow('', false);
    rows.push(r);
    listEl.insertAdjacentHTML('beforeend', rowHTML(r));

    const lastRow = listEl.lastElementChild;
    const input = lastRow.querySelector('.bank-input');
    if (input) input.focus();
    if (lastRow.scrollIntoView) lastRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });

  /* ============ 儲存 ============ */
  saveBtn.addEventListener('click', function () {
    save();
    showToast('已儲存 ✓');
    checkReminders();
  });

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
  }

  /* ============ 到期提醒 ============ */
  function checkReminders() {
    const list = [];

    rows.forEach(function (r) {
      if (r.paid || !r.due) return;
      const d = daysUntil(r.due);
      if (d === null) return;
      if (d <= REMIND_DAYS) {
        list.push({ name: r.name || '（未命名銀行）', due: r.due, days: d });
      }
    });

    if (!list.length) return;

    list.sort(function (a, b) { return a.days - b.days; });

    modalList.innerHTML = list.map(function (item) {
      let tag, cls;
      if (item.days < 0) {
        tag = '已逾期 ' + (-item.days) + ' 天'; cls = 'overdue';
      } else if (item.days === 0) {
        tag = '今天截止'; cls = 'urgent';
      } else {
        tag = '剩 ' + item.days + ' 天'; cls = 'soon';
      }
      return ''
        + '<li>'
        +   '<div class="rem-info">'
        +     '<strong>' + esc(item.name) + '</strong>'
        +     '<span>繳費截止日：' + fmtDate(item.due) + '</span>'
        +   '</div>'
        +   '<span class="tag ' + cls + '">' + tag + '</span>'
        + '</li>';
    }).join('');

    modal.hidden = false;
  }

  function closeModal() { modal.hidden = true; }

  closeBtn.addEventListener('click', closeModal);
  modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !modal.hidden) closeModal();
  });

  /* ============ 啟動 ============ */
  load();
  render();
  checkReminders();

})();
</script>
</body>
</html>
